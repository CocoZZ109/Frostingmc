name: Build FrostingSMP
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q frostingsmp-fixed-source2.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: gradle build --no-daemon
        working-directory: frostingsmp
      - uses: actions/upload-artifact@v4
        with:
          name: FrostingSMP
          path: frostingsmp/build/libs/FrostingSMP.jar
